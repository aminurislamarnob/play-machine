appId: com.playmachine.courseplayer
productName: Playmachine
copyright: Copyright © 2026 Playmachine
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
mac:
  category: public.app-category.education
  icon: build/icon.png
  darkModeSupport: true
  target:
